[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "briefing-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "agno",
    "discord.py",
    "apscheduler",
    "pydantic",    
    "httpx",
    "python-dotenv",
    "groq",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
